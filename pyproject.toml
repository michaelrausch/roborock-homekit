[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roborock-homekit"
version = "0.1.0"
description = "Expose a Roborock vacuum to Apple HomeKit. Small enough for a Raspberry Pi Zero W."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "python-roborock>=7.23,<8",
    "HAP-python[QRCode]>=5.2,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
roborock-homekit = "roborock_homekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
